services:
  api-host:
    build:
      context: ../..
      dockerfile: api_host/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_ADDRESS: ":8080"
      API_KEY: "${API_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ALLOW_ANONYMOUS: "${ALLOW_ANONYMOUS:-false}"
      ALLOW_DIRECTORY_ACCESS: "${ALLOW_DIRECTORY_ACCESS:-false}"
      DATA_ROOT: /data
      DOCKER_DATA_ROOT: "${DOCKER_DATA_ROOT:-/srv/big-batch-ocr-data}"
      DATABASE_PATH: /var/lib/api-host/jobs.db
      OCR_IMAGE: "${OCR_IMAGE:?set OCR_IMAGE to a versioned image reference}"
      OCR_JOBS: "${OCR_JOBS:-3}"
      OCR_LANGUAGE: "${OCR_LANGUAGE:-eng}"
      OCR_OPTIMIZE: "${OCR_OPTIMIZE:-3}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-1}"
      SYNC_WAIT_LIMIT_SECONDS: "${SYNC_WAIT_LIMIT_SECONDS:-30}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DOCKER_DATA_ROOT:-/srv/big-batch-ocr-data}:/data:rw"
      - api-host-state:/var/lib/api-host
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the Docker socket group ID}"

volumes:
  api-host-state:
