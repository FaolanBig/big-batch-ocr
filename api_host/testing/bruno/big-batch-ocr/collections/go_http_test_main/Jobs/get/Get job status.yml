info:
  name: Get job status
  type: http
  seq: 1
  tags:
    - Jobs

http:
  method: GET
  url: "{{baseUrl}}/api/v1/jobs/{{jobId}}"
  auth: inherit

runtime:
  variables:
    - name: jobId
      value: job_69850a7de64002814577

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Job waiting for an available worker
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobId"
      method: GET
      params:
        - name: jobId
          value: job_01J9M7X2K6
          type: path
          description: Identifier returned when the job was submitted.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobId": "job_01J9M7X2K6",
            "status": "queued",
            "inputPath": "incoming/invoices",
            "outputPath": "processed/invoices",
            "createdAt": "2026-10-12T14:10:00Z",
            "startedAt": null,
            "completedAt": null,
            "exitCode": null,
            "error": null,
            "statusUrl": "/api/v1/jobs/job_01J9M7X2K6"
          }
  - name: Job in progress
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobId"
      method: GET
      params:
        - name: jobId
          value: job_01J9M7X2K6
          type: path
          description: Identifier returned when the job was submitted.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobId": "job_01J9M7X2K6",
            "status": "running",
            "inputPath": "incoming/invoices",
            "outputPath": "processed/invoices",
            "createdAt": "2026-10-12T14:10:00Z",
            "startedAt": "2026-10-12T14:10:01Z",
            "completedAt": null,
            "exitCode": null,
            "error": null,
            "statusUrl": "/api/v1/jobs/job_01J9M7X2K6"
          }
  - name: Successfully completed job
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobId"
      method: GET
      params:
        - name: jobId
          value: job_01J9M7X2K6
          type: path
          description: Identifier returned when the job was submitted.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobId": "job_01J9M7X2K6",
            "status": "succeeded",
            "inputPath": "incoming/invoices",
            "outputPath": "processed/invoices",
            "createdAt": "2026-10-12T14:10:00Z",
            "startedAt": "2026-10-12T14:10:01Z",
            "completedAt": "2026-10-12T14:10:18Z",
            "exitCode": 0,
            "error": null,
            "statusUrl": "/api/v1/jobs/job_01J9M7X2K6"
          }
  - name: Job failed
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobId"
      method: GET
      params:
        - name: jobId
          value: job_01J9M7X2K6
          type: path
          description: Identifier returned when the job was submitted.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "jobId": "job_01J9M7X2K6",
            "status": "failed",
            "inputPath": "incoming/invoices",
            "outputPath": "processed/invoices",
            "createdAt": "2026-10-12T14:10:00Z",
            "startedAt": "2026-10-12T14:10:01Z",
            "completedAt": "2026-10-12T14:10:18Z",
            "exitCode": 1,
            "error": {
              "code": "OCR_EXECUTION_FAILED",
              "message": "The OCR container exited unsuccessfully."
            },
            "statusUrl": "/api/v1/jobs/job_01J9M7X2K6"
          }
  - name: 401 Response
    description: Bearer key is missing or invalid. Credentials are never returned in error responses.
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobId"
      method: GET
      params:
        - name: jobId
          value: job_01J9M7X2K6
          type: path
          description: Identifier returned when the job was submitted.
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unauthorized",
            "status": 401,
            "code": "UNAUTHENTICATED",
            "detail": "A valid bearer API key is required."
          }
  - name: 404 Response
    description: No job with this identifier is available to the authenticated caller.
    request:
      url: "{{baseUrl}}/api/v1/jobs/:jobId"
      method: GET
      params:
        - name: jobId
          value: job_01J9M7X2K6
          type: path
          description: Identifier returned when the job was submitted.
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Job not found",
            "status": 404,
            "code": "JOB_NOT_FOUND",
            "detail": "No job was found for the supplied identifier."
          }

docs: Returns the latest persisted state and outcome for a submitted job. A failed job is returned as a job resource with status `failed`; this is distinct from an HTTP error retrieving the resource. If the host restarts while work is unfinished, the API must not report it as successful unless completion was confirmed.
