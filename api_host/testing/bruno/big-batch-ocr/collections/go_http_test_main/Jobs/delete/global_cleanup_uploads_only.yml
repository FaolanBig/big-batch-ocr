info:
  name: global_cleanup_uploads_only
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/jobs/cleanup"
  body:
    type: json
    data: |-
      {
        "scope": "uploads"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
