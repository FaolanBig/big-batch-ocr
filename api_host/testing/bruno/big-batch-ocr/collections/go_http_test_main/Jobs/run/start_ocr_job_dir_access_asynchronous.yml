info:
  name: start_ocr_job_dir_access_asynchronous
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/jobs"
  body:
    type: multipart-form
    data:
      - name: inputPath
        type: text
        value: incoming/sample
      - name: outputPath
        type: text
        value: processed/sample
      - name: mode
        type: text
        value: asynchronous
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setEnvVar("jobId", data.jobId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
