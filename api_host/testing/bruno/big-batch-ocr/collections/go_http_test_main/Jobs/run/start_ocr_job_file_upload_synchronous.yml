info:
  name: start_ocr_job_file_upload_synchronous
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/jobs"
  body:
    type: multipart-form
    data:
      - name: inputArchive
        type: file
        value:
          - \\wsl.localhost\Ubuntu-24.04\home\fb\test\Vertrag01.tar.gz
        contentType: application/gzip
      - name: mode
        type: text
        value: synchronous
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jobId = res.getHeader("X-Job-ID");
        bru.setEnvVar("jobId", jobId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
