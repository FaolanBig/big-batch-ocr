info:
  name: start_ocr_job_dir_access_synchronous
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/jobs"
  body:
    type: multipart-form
    data:
      - name: inputPath
        type: text
        value: incoming/sample
      - name: outputPath
        type: text
        value: processed/sample
      - name: mode
        type: text
        value: synchronous
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jobId = res.getHeader("X-Job-ID");
        bru.setEnvVar("jobId", jobId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
