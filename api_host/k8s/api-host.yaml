apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-host-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rwx-rf2-lrs
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-host-state
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rwo-rf2-zrs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-host
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-host
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-host
subjects:
  - kind: ServiceAccount
    name: api-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-host
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-host-ocr-isolated
spec:
  podSelector:
    matchExpressions:
      - key: big-batch-ocr/job-id
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-host
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-host
  template:
    metadata:
      labels:
        app: api-host
    spec:
      serviceAccountName: api-host
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: api-host
          image: ghcr.io/faolanbig/big-batch-ocr_api-host:v1.2.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_ADDRESS
              value: ":8080"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-host-secrets
                  key: API_KEY
            - name: LOG_LEVEL
              value: INFO
            - name: ALLOW_DIRECTORY_ACCESS
              value: "false"
            - name: DATA_ROOT
              value: /data
            - name: DATABASE_PATH
              value: /var/lib/api-host/jobs.db
            - name: OCR_IMAGE
              value: ghcr.io/faolanbig/big-batch-ocr_ocr-sequencial:v1.2.1
            - name: OCR_JOBS
              value: "12"
            - name: OCR_CPU_REQUEST
              value: "12"
            - name: OCR_CPU_LIMIT
              value: "16"
            - name: OCR_MEMORY_REQUEST
              value: 2Gi
            - name: OCR_MEMORY_LIMIT
              value: 4Gi
            - name: OCR_LANGUAGE
              value: eng
            - name: OCR_OPTIMIZE
              value: "3"
            - name: MAX_CONCURRENT_JOBS
              value: "10"
            - name: SYNC_WAIT_LIMIT_SECONDS
              value: "30"
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: state
              mountPath: /var/lib/api-host
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-host-data
        - name: state
          persistentVolumeClaim:
            claimName: api-host-state
---
apiVersion: v1
kind: Service
metadata:
  name: api-host
spec:
  selector:
    app: api-host
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
